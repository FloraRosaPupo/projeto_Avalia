name: avalia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  timeago: ^3.7.1
  flutter_colorpicker: ^1.1.0
  dotted_border: ^3.1.0
  font_awesome_flutter: ^10.9.1
  supabase_flutter: ^2.10.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  image_picker: ^1.2.1
  google_generative_ai: ^0.4.7
  lottie: ^3.3.1
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_native_splash:
  color: "#8FD3E8"
  image: assets/my_logo.png

  android: true
  ios: true

  android_12:
    color: "#8FD3E8"
    image: assets/my_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/my_logo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/my_logo.png"
